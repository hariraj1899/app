<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Travel Planner</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-800 font-sans antialiased">

  <!-- Header Navigation -->
  <header class="flex items-center justify-between px-8 py-4 bg-white border-b border-gray-100">
    <div class="flex items-center space-x-2">
      
      
    </div>
    
    <div>
      <button class="bg-black text-white px-5 py-2 rounded-md font-semibold text-xs hover:bg-gray-800 transition">
        Sign In
      </button>
    </div>
  </header>

  <!-- Main Hero Content -->
  <main class="max-w-4xl mx-auto text-center px-4 pt-16 pb-12">
    <h1 class="text-3xl sm:text-4xl font-extrabold text-red-400 mb-2">
      Discover Your Next Adventure with AI:
    </h1>
    <h2 class="text-4xl sm:text-5xl font-black text-black mb-6">
      Personalized Itineraries at Your Fingertips
    </h2>
    <p class="text-gray-500 text-base sm:text-lg max-w-2xl mx-auto mb-8">
      Your personal trip planner and travel curator, creating custom itineraries tailored to your interests and budget.
    </p>

    <a href="#" class="inline-block bg-black text-white px-6 py-3 rounded-md font-semibold text-xs tracking-wide hover:bg-gray-800 transition">
      Get Started, It's free
    </a>

    <div class="mt-16">
      <h3 class="text-5xl font-serif text-black tracking-tight mb-6">
        AI Travel Planner
      </h3>
      <div class="w-32 h-[1px] bg-gray-400 mx-auto mb-6"></div>
      <p class="text-gray-600 text-sm font-medium">
        Integrated with Gemini AI and Google Maps APIs
      </p>
    </div>

    <!-- Screen Preview Frame -->
    <div class="mt-8 max-w-xl mx-auto border-8 border-black rounded-t-3xl overflow-hidden bg-black shadow-2xl">
      <div class="bg-gray-100 p-2">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80" alt="App Preview" class="w-full h-64 object-cover rounded-lg">
      </div>
    </div>
  </main>

</body>
</html>
