<!DOCTYPE html>
<html lang="en">
<head>
<style>
  body { font-family: 'Georgia', serif; background-color: #f0f0f0; display: flex; justify-content: center; padding: 20px; }
  .certificate-container { 
    width: 800px; height: 560px; padding: 30px; border: 15px solid #d4af37; 
    background-color: white; position: relative; text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.2); 
  }
  .inner-border { border: 2px solid #d4af37; height: 100%; padding: 20px; box-sizing: border-box; }
  h1 { font-size: 50px; margin-top: 10px; color: #333; }
  h2 { font-size: 24px; font-weight: normal; font-style: italic; }
  .student-name { font-size: 40px; border-bottom: 2px solid #333; display: inline-block; padding: 0 20px; margin: 20px 0; }
  .details { font-size: 20px; line-height: 1.6; margin: 20px 0; }
  .signatures { display: flex; justify-content: space-around; margin-top: 50px; }
  .sig-line { border-top: 1px solid #333; width: 200px; padding-top: 5px; font-size: 16px; }
</style>
</head>
<body>

<div class="certificate-container">
  <div class="inner-border">
    <h1>CERTIFICATE</h1>
    <h2>OF GRADUATION</h2>
    
    <p class="details">This is to certify that</p>
    <div class="student-name">John Doe</div>
    
    <p class="details">
      has successfully completed the requirements for the degree of<br>
      <strong>Bachelor of Science in Computer Science</strong><br>
      on this day, April 13, 2026.
    </p>

    <div class="signatures">
      <div class="sig-line">University Dean</div>
      <div class="sig-line">Registrar</div>
    </div>
  </div>
</div>

</body>
</html>
